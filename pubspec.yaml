name: habit_tracker
description: "Offline Arabic habit and daily progress tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.5.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^11.0.3
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.4.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#E9FFF4"
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_foreground_inset: 12
  windows:
    generate: true
    image_path: assets/images/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
